name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  node-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show node version
        run: node -v
      - name: Run test suite
        run: node --test
