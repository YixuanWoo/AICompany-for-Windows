# 最小可运行配置：2 个席位、零产品名、零外部凭据即可加载。
# 真实配置不入库（见 .gitignore）；命令与凭据一律写成 ${ENV_VAR}。
version: 1
company:
  name: example-company
  timezone: Asia/Shanghai
interaction:
  defaultMode: delegate
  defaultTarget: ceo
  allowDirectTo: [plan, delegate, review, execute, escalate, readOnly]
  autoAssign: false
  modes:
    delegate:
      createTask: true
      wake: [defaultTarget]
      ceoVisibility: decide
    direct:
      createTask: true
      wake: [addressedTo]
      ceoVisibility: cc
    cowork:
      createTask: false
      wake: [addressedTo]
      ceoVisibility: none
      container: workThread
    meeting:
      createTask: false
      wake: [rollCall]
      ceoVisibility: cc
      container: workThread
  meeting:
    defaultStyle: rollCall
    fullRequiresConfirm: true
  thread:
    ttlDays: 30
    promoteRequiresExplicit: true
# 编制外席位不写在这里（P5-4 决议，见 docs/P5-交付说明.md）：
# today 这类「只读巡检」是靠外部定时拉 API 出简报的角色——不派活、不验收、不进状态机。
# 把它配成席位反而会被当成可用工位派活，所以示例 profile 刻意不配；它想要的那份简报，
# 由控制面自己的 /api/dashboard + /api/audit 定时拉取即可。
agents:
  # 席位（岗位）与担任者（谁在干）分开写：post = 岗位名，holder = 由谁担任。
  # post 是席位的名字，不随换人改变；holder 换人只改这一行。id 只作内部标识与历史对接。
  - id: ceo
    post: 总经理
    holder: 外部 agent
    holderKind: external-agent
    displayName: 总经理
    isCEO: true
    capabilities: [plan, delegate, review, escalate]
    status: active
    quotaDaily: 20
    reportsTo: null
    adapter:
      type: cli-acp
      config:
        command: ${AICOMPANY_CEO_CMD}
  - id: worker-01
    post: 执行
    holder: 本地脚本
    holderKind: process
    displayName: 执行席位
    isCEO: false
    capabilities: [execute]
    status: active
    quotaDaily: 20
    reportsTo: ceo
    # G3 难度分流：maxDifficulty 是这个岗位「最多能接几档」，不写 = 不设限（hard）。
    # 想限制（比如让轻量席位只干简单活），写 easy / normal / hard 之一；
    # 一张 hard 卡只会派给写得起的席位，简单活优先给「刚够用」的席位。
    # maxDifficulty: easy
    adapter:
      type: process
      config:
        command: ${AICOMPANY_WORKER_CMD}
clients: [web]
notifier: [noop]
