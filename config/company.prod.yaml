# 生产实例配置：一句话下单 → 豆包工作直接干 → 产物回看板。
#
# 用法：
#   npm run win:install            # 注册常驻（登入自启 + 每 5 分钟巡检）
#   http://127.0.0.1:3100/         # 打开看板，写一句话，点提交
#   或命令行：npm run task -- "写一份本周工作简报"
#
# 三条约定：
# 1. defaultMode 是 direct：一句话直投执行席位。
#    交付给 ceo-agent = 真·带工具的 agent（dsh webhook，能读盘能执行，2026-11-16 接上）；
#    交付给 doubao = GUI 抢键鼠操作豆包窗口（旧路径，保留）。
#    delegate 模式下 CEO 由 scripts/router-ceo.js 派单，优先派给第一个执行席位（现为 ceo-agent）。
# 2. 窗口标题只写「豆包工作」这个稳定片段（完整标题前面还挂着会话名，会变）。
# 3. GUI 席位全局只能有一份：本配置带 GUI 席位，第二个带 GUI 席位的实例会被启动时拒绝。
#
# ceo-agent 前置条件：dsh web 8080 正在跑、且装了 dsh-ceo-webhook 插件（见 integrations/dsh/ceo-webhook/）。
# 没装 dsh 的机器请把 ceo-agent 这一段从 agents 里删掉，其余配置照常可用。
version: 1
company:
  name: aicompany-prod
  timezone: Asia/Shanghai
# 生产产物与演示实例（work/）分开，互不干扰。
workRoot: D:/开源/AICompany/work-prod
# P7 项目层：配了项目就「建卡必选项目」。
# 规范与记忆都在 work-prod/projects/<id>/ 下（公司文件夹 = 大脑）。
# 产物落哪儿跟着项目走：项目条目里 rootDir 就写它的文件夹位置（填了就是授权），
# 验收通过后产物落到 rootDir（+ deliverSubdir 子目录）；不填 rootDir = 产物只留在公司，人自己取。
projects:
  benny:
    displayName: 小王子翻译
    memoryLimit: 10
    # 项目文件夹（这个项目的工地）：产物验收通过后落到它里面，引擎只在这个边界内写。
    rootDir: D:/Benny/20_项目/小王子翻译
    # 默认落点（相对 rootDir）：这一单没指定落哪儿时用。四道工序各自的正式落点写在 project.yaml 里。
    deliverSubdir: 04-译稿
    # 这些进程在跑时先不落盘（译台开着会锁住 04-译稿 里的文件），等它关掉由维护心跳重试。
    deliverBlockers: ["YiTai*"]
  aicompany-dev:
    displayName: AICompany 自研开发
    memoryLimit: 20
    # 不填 rootDir：改源码的活由人集成，引擎不自动往仓库里写文件。
interaction:
  # delegate = 董事会 → CEO → 员工。CEO 是真 agent：定项目归属、拆活派活、验收。
  # direct 仍然可用（指名直投某个员工，不经 CEO），但不是默认路径。
  defaultMode: delegate
  defaultTarget: ceo
  allowDirectTo: [execute]
  autoAssign: false
  modes:
    delegate:
      createTask: true
      wake: [defaultTarget]
      ceoVisibility: decide
    direct:
      createTask: true
      wake: [addressedTo]
      ceoVisibility: cc
    cowork:
      createTask: false
      wake: [addressedTo]
      ceoVisibility: none
      container: workThread
    meeting:
      createTask: false
      wake: [rollCall]
      ceoVisibility: cc
      container: workThread
quota:
  warnRatio: 0.8
  stopRatio: 1
  periodHours: 24
runPolicy:
  # 执行岗是桌面应用，天然串行（一把键鼠）；并发给 2 是为了「总经理在拆活/验收」和
  # 「执行岗在干活」不互相排队（两者用的是完全不同的资源：一个是 8080 的 agent，一个是本机窗口）。
  maxConcurrent: 2
  cooldownSec: 0
  maxRunHours: 2
# ── 两层席位模型（2026-11-16 定） ─────────────────────────────────
# holders = 担任者：真的是一个 agent / 一个程序，name 就是它的名字（一看就知道谁干）。
# posts   = 岗位：席位的名字（一看就知道干啥），heldBy 指向由谁担任。
# 一个 agent 可以担任多个岗位：adapter 配置写在 holder 上，岗位用 adapterConfig 覆盖参数；
# 引擎按「岗位」建卡、计额，但调用的是同一个 agent。
holders:
  # 担任者 1：8080 上的规划 agent。按量计费、贵，只用来做规划和验收。
  - id: dsh-planner
    name: dsh 规划 agent
    kind: external-agent
    adapter:
      type: webhook-exec
      config:
        baseUrl: http://127.0.0.1:8080
        timeoutMs: 900000
        pollMs: 2000
  # 担任者 2：桌面上的豆包工作。抢键鼠、一次一件，适合写文档 / 翻译 / 点界面的活。
  - id: doubao-work
    name: 豆包工作
    kind: gui-app
    adapter:
      type: gui-template
      config:
        windowTitle: 豆包工作
        windowTitleMatch: contains
        driver: command
        reportMode: draft
        # 跨实例互斥：同一台机器上第二个 GUI 任务会拿到「正被占用」而不是一起抢键盘。
        lockPath: D:/开源/AICompany/work/gui-seat.lock
        # 抢完键鼠把剪贴板原样还回去（提示词几百字，不能把你正在复制的东西顶掉）。
        restoreClipboard: true
        steps:
          - action: activate
          # 新会话：ctrl+n 只是手段，判据是标题变回纯产品名。核对不上照旧发，报告里标 reused。
          - action: newSession
          - action: paste
          - action: press
            key: enter
          # 提示词发出后立刻把焦点还给用户——后面是等文件，不需要再占着屏幕。
          - action: restoreFocus
        freshTitle: 豆包工作
        newSessionAttempts: 2
        newSessionPolls: 4
        newSessionPollMs: 400
        onNewSessionMismatch: continue
        # 「现在该不该抢键鼠」的四道闸。全部可关：删掉 gate 段就回到旧行为。
        gate:
          # 看板上的「暂停 GUI」按钮改的就是这个文件；文件不存在 = 正常跑。
          pauseFile: D:/开源/AICompany/work/gui-pause.json
          # 你 3 秒内动过键盘鼠标就不抢：稍等一会儿，维护心跳会自动重投这张卡。
          requireIdleSec: 3
          # 锁屏时按键会落到登录界面，一律不跑。
          requireUnlocked: true
          # 想只在半夜跑就打开这一行（示例：23 点到次日 7 点）：
          # allowedHours: [23, 7]
        commands:
          activate: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action activate -WindowTitle "{{windowTitle}}"'
          newSession: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action hotkey -Keys "ctrl+n"'
          hotkey: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action hotkey -Keys "{{keys}}"'
          setClipboard: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action setclip -TextFile "{{textFile}}"'
          paste: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action paste'
          press: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action press -Key "{{key}}"'
          foregroundTitle: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action foreground'
          # 一次调用拿齐：闲了多久、锁没锁屏、剪贴板原来是什么（顺带落盘供稍后还原）。
          preflight: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action preflight -OutputFile "{{outputFile}}"'
          restoreFocus: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action restorefocus'
          screenshot: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action shot -OutputFile "{{outputFile}}"'
        pollIntervalMs: 5000
        maxMinutes: 20
# ── 岗位（席位） ────────────────────────────────────────────────
posts:
  # 岗位 1：总经理 —— 只做三件事：定方向、拆活派活、验收；严禁自己干活。
  # 它每个 token 都该花在「派给谁」上。adapterConfig.mode=ceo 让这个岗位按 CEO 契约输出。
  - id: ceo
    title: 总经理
    heldBy: dsh-planner
    adapterConfig:
      mode: ceo
    isCEO: true
    capabilities: [plan, delegate, review, escalate]
    status: active
    quotaDaily: 40
    reportsTo: null
  # 岗位 2：执行 —— 所有实际干活、产出交付物都走这个岗位。
  # 不写 maxDifficulty = 什么难度都能接（G3 的上限语义）。
  - id: doubao
    title: 执行
    heldBy: doubao-work
    isCEO: false
    capabilities: [execute]
    status: active
    quotaDaily: 20
    reportsTo: ceo
clients: [web]
# web：看板 inbox 用；desktop：看板关着时也弹气泡提醒「待你拍板」。
notifier: [web, desktop]
