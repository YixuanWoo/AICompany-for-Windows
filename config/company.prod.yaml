# 生产实例配置：一句话下单 → 豆包工作直接干 → 产物回看板。
#
# 用法：
#   npm run win:install            # 注册常驻（登入自启 + 每 5 分钟巡检）
#   http://127.0.0.1:3100/         # 打开看板，写一句话，点提交
#   或命令行：npm run task -- "写一份本周工作简报"
#
# 三条约定：
# 1. defaultMode 是 direct：一句话直投执行席位。
#    交付给 ceo-agent = 真·带工具的 agent（dsh webhook，能读盘能执行，2026-11-16 接上）；
#    交付给 doubao = GUI 抢键鼠操作豆包窗口（旧路径，保留）。
#    delegate 模式下 CEO 由 scripts/router-ceo.js 派单，优先派给第一个执行席位（现为 ceo-agent）。
# 2. 窗口标题只写「豆包工作」这个稳定片段（完整标题前面还挂着会话名，会变）。
# 3. GUI 席位全局只能有一份：本配置带 GUI 席位，第二个带 GUI 席位的实例会被启动时拒绝。
#
# ceo-agent 前置条件：dsh web 8080 正在跑、且装了 dsh-ceo-webhook 插件（见 integrations/dsh/ceo-webhook/）。
# 没装 dsh 的机器请把 ceo-agent 这一段从 agents 里删掉，其余配置照常可用。
version: 1
company:
  name: aicompany-prod
  timezone: Asia/Shanghai
# 生产产物与演示实例（work/）分开，互不干扰。
workRoot: D:/开源/AICompany/work-prod
# P7 项目层：配了项目就「建卡必选项目」。
# 规范与记忆都在 work-prod/projects/<id>/ 下（公司文件夹 = 大脑）。
# 产物落哪儿跟着项目走：项目条目里 rootDir 就写它的文件夹位置（填了就是授权），
# 验收通过后产物落到 rootDir（+ deliverSubdir 子目录）；不填 rootDir = 产物只留在公司，人自己取。
projects:
  benny:
    displayName: 小王子翻译
    memoryLimit: 10
    # 项目文件夹（这个项目的工地）：产物验收通过后落到它里面，引擎只在这个边界内写。
    rootDir: D:/Benny/20_项目/小王子翻译
    # 默认落点（相对 rootDir）：这一单没指定落哪儿时用。四道工序各自的正式落点写在 project.yaml 里。
    deliverSubdir: 04-译稿
    # 这些进程在跑时先不落盘（译台开着会锁住 04-译稿 里的文件），等它关掉由维护心跳重试。
    deliverBlockers: ["YiTai*"]
  aicompany-dev:
    displayName: AICompany 自研开发
    memoryLimit: 20
    # 不填 rootDir：改源码的活由人集成，引擎不自动往仓库里写文件。
# ── 仓库台账（2026-11-16 定）─────────────────────────────────────
# 与项目解耦：项目回答「这摊事归谁、交付落哪、经验记哪」，
# 仓库回答「代码在这台机器的哪个目录、对应哪个远端、谁审、许不许自动推」。
# 一个项目可以没有仓库（翻译），一个仓库也可以不属于任何项目（开源小工具）。
# 只有登记在这里的仓库，scripts/repo.js 才会碰；推送必须显式 allowPush: true。
repos:
  yitai:
    displayName: 译台 YiTai
    path: D:/开源/YiTai
    remote: YixuanWoo/YiTai
    # 这个仓库的主干叫 master（远端默认分支也是 master）；写错分支 push 会被闸拦下。
    branch: master
    # 谁审这个仓库的代码：工程岗。审完由它提交并推送。
    reviewer: engineering
    allowPush: true
    note: Windows 桌面翻译工作台；公开发布，推送到 main 前必须过工程审查。
  aicompany:
    displayName: AICompany 引擎
    path: D:/开源/AICompany
    # 还没建远端仓库：先在本地留档，不推送（要上线 GitHub 由董事会点头后再填 remote）。
    remote: null
    branch: main
    reviewer: engineering
    allowPush: false
    note: 公司自身源码；改动必须过审查，跑全量测试后才能提交。
# ── 产物政策 ───────────────────────────────────────────────────
# 执行岗干完自己判断产物类型与去向，这里只给默认值和兜底规则。
artifacts:
  # 受管代码默认交给工程岗审（审完由它提交推送）。
  defaultReviewer: engineering
  # 日常循环任务（巡检 / 体检 / 清理 / 简报）默认交给工程岗审。
  # 这类活审的是「有没有照做、数字对不对」，CEO 每轮看一遍只是一句「知道了」，纯烧额度。
  # 方向性长期任务由 CEO 在排班建议里显式写 reviewBy: ceo（或 human = 董事会亲审）。
  routineReviewer: engineering
  # 认不出发布者时（老数据 / 系统自动派单）怎么走：
  #   byAssigner = 按发布者推导（董事会派的落盘、上级派的回审）—— 日常都走这条，不看这个字段
  #   ceo = 一律请总经理验收（最保守，费 CEO 额度）
  #   land = 一律直接落盘（最省，但没人把关）
  defaultHandoff: byAssigner
  # 判成受管代码却没写 repo → 打回。代码流到没人管的地方比没写更糟。
  requireRepoForManagedCode: true
# ── 主动唤醒 ───────────────────────────────────────────────────
# 工程岗是「人叫才醒」的席位：没有常驻进程，卡排进队列就等人来领。
# 这里让控制面自己去叫 —— 往 WorkBuddy 当前会话投一条消息，收到消息我就醒了。
# 走的是 CodeBuddy Gateway（剪辑工作台「交给 Agent」用的同一条），
# 不需要常驻进程，也不需要任何外部 API key。
# 凭据由工作台的 SessionStart hook 每次会话写入（端口和密码每个会话都变），这里只读不写。
wake:
  enabled: true
  # 会话正忙时最多等 10 分钟补发（忙时硬发会被网关直接丢掉）。
  maxWaitMs: 600000
  # 同一张卡 10 分钟内不重复叫：打回重做、心跳重投不该把会话刷爆。
  cooldownMs: 600000
interaction:
  # delegate = 董事会 → CEO → 员工。CEO 是真 agent：定项目归属、拆活派活、验收。
  # direct 仍然可用（指名直投某个员工，不经 CEO），但不是默认路径。
  defaultMode: delegate
  defaultTarget: ceo
  # 总经理会话：所有工作共用一个会话 —— 前缀稳定才能命中缓存，按量计费席位省的是真钱。
  # 到 warnTurns 提醒董事会换新，到 maxTurns 自动换；reuse=false 可回到「每轮新会话」的旧行为。
  ceoSession:
    reuse: true
    warnTurns: 30
    maxTurns: 60
  allowDirectTo: [execute]
  autoAssign: false
  modes:
    delegate:
      createTask: true
      wake: [defaultTarget]
      ceoVisibility: decide
    direct:
      createTask: true
      wake: [addressedTo]
      ceoVisibility: cc
    cowork:
      createTask: false
      wake: [addressedTo]
      ceoVisibility: none
      container: workThread
    meeting:
      createTask: false
      wake: [rollCall]
      ceoVisibility: cc
      container: workThread
quota:
  warnRatio: 0.8
  stopRatio: 1
  periodHours: 24
runPolicy:
  # 执行岗是桌面应用，天然串行（一把键鼠）；并发给 2 是为了「总经理在拆活/验收」和
  # 「执行岗在干活」不互相排队（两者用的是完全不同的资源：一个是 8080 的 agent，一个是本机窗口）。
  maxConcurrent: 2
  cooldownSec: 0
  maxRunHours: 2
# ── 两层席位模型（2026-11-16 定） ─────────────────────────────────
# holders = 担任者：真的是一个 agent / 一个程序，name 就是它的名字（一看就知道谁干）。
# posts   = 岗位：席位的名字（一看就知道干啥），heldBy 指向由谁担任。
# 一个 agent 可以担任多个岗位：adapter 配置写在 holder 上，岗位用 adapterConfig 覆盖参数；
# 引擎按「岗位」建卡、计额，但调用的是同一个 agent。
holders:
  # 担任者 1：8080 上的规划 agent。按量计费、贵，只用来做规划和验收。
  - id: dsh-planner
    name: dsh 规划 agent
    kind: external-agent
    adapter:
      type: webhook-exec
      config:
        baseUrl: http://127.0.0.1:8080
        timeoutMs: 900000
        pollMs: 2000
  # 担任者 2：桌面上的豆包工作。抢键鼠、一次一件，适合写文档 / 翻译 / 点界面的活。
  - id: doubao-work
    name: 豆包工作
    kind: gui-app
    adapter:
      type: gui-template
      config:
        windowTitle: 豆包工作
        windowTitleMatch: contains
        driver: command
        reportMode: draft
        # 跨实例互斥：同一台机器上第二个 GUI 任务会拿到「正被占用」而不是一起抢键盘。
        lockPath: D:/开源/AICompany/work/gui-seat.lock
        # 抢完键鼠把剪贴板原样还回去（提示词几百字，不能把你正在复制的东西顶掉）。
        restoreClipboard: true
        steps:
          - action: activate
          # 新会话：ctrl+n 只是手段，判据是标题变回纯产品名。核对不上照旧发，报告里标 reused。
          - action: newSession
          - action: paste
          - action: press
            key: enter
          # 提示词发出后立刻把焦点还给用户——后面是等文件，不需要再占着屏幕。
          - action: restoreFocus
        freshTitle: 豆包工作
        newSessionAttempts: 2
        newSessionPolls: 4
        newSessionPollMs: 400
        onNewSessionMismatch: continue
        # 「现在该不该抢键鼠」的四道闸。全部可关：删掉 gate 段就回到旧行为。
        gate:
          # 看板上的「暂停 GUI」按钮改的就是这个文件；文件不存在 = 正常跑。
          pauseFile: D:/开源/AICompany/work/gui-pause.json
          # 你 3 秒内动过键盘鼠标就不抢：稍等一会儿，维护心跳会自动重投这张卡。
          requireIdleSec: 3
          # 锁屏时按键会落到登录界面，一律不跑。
          requireUnlocked: true
          # 想只在半夜跑就打开这一行（示例：23 点到次日 7 点）：
          # allowedHours: [23, 7]
        commands:
          activate: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action activate -WindowTitle "{{windowTitle}}"'
          newSession: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action hotkey -Keys "ctrl+n"'
          hotkey: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action hotkey -Keys "{{keys}}"'
          setClipboard: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action setclip -TextFile "{{textFile}}"'
          paste: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action paste'
          press: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action press -Key "{{key}}"'
          foregroundTitle: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action foreground'
          # 一次调用拿齐：闲了多久、锁没锁屏、剪贴板原来是什么（顺带落盘供稍后还原）。
          preflight: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action preflight -OutputFile "{{outputFile}}"'
          restoreFocus: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action restorefocus'
          screenshot: 'powershell -ExecutionPolicy Bypass -File scripts/win/kb.ps1 -Action shot -OutputFile "{{outputFile}}"'
        pollIntervalMs: 5000
        maxMinutes: 20
  # 担任者 3：会话里的 WorkBuddy agent（就是跟我对话的这个）。
  # 它没有常驻进程——人叫才醒，所以对应岗位必须配 dispatch: pull：
  # 控制面不直调，卡留在队列等它自己来领（scripts/seat.js）。
  # adapter 用 seat 而不是 mock：万一哪天被误配成直派，会当场报错，而不是假装干完了。
  - id: wb-agent
    name: WorkBuddy agent
    kind: external-agent
    adapter:
      type: seat
# ── 岗位（席位） ────────────────────────────────────────────────
posts:
  # 岗位 1：总经理 —— 只做三件事：定方向、拆活派活、验收；严禁自己干活。
  # 它每个 token 都该花在「派给谁」上。adapterConfig.mode=ceo 让这个岗位按 CEO 契约输出。
  - id: ceo
    title: 总经理
    heldBy: dsh-planner
    adapterConfig:
      mode: ceo
    isCEO: true
    capabilities: [plan, delegate, review, escalate]
    status: active
    quotaDaily: 40
    reportsTo: null
    # 真公司的 CEO：定方向、定结果标准、交给能独立交付的那一级，然后对董事会负责。
    # 不替工程岗拆实现 —— 拆到文件/命令那一层，它只会照抄，遇到岔路也不会自己判断。
    duties: 定方向与结果标准、判断归属与新项目、派给能独立交付的席位、审方向性结果、对董事会负责；不自己拆实现
    # 受限 YAML 不支持多行标量列表，一律写成行内数组。
    boundaries: ["不写代码、不改文件、不产出交付物", "不替工程岗拆实现步骤 / 不指定技术选型", "不越过董事会对花钱和对外承诺做决定"]
  # 岗位 2：执行 —— 所有实际干活、产出交付物都走这个岗位。
  # 不写 maxDifficulty = 什么难度都能接（G3 的上限语义）。
  # 汇报线挂在工程岗下面：遇到技术上的岔路先找工程岗，工程岗判断要不要再往上捅。
  - id: doubao
    title: 执行
    heldBy: doubao-work
    isCEO: false
    capabilities: [execute]
    status: active
    quotaDaily: 20
    reportsTo: engineering
    escalationTo: engineering
    duties: 写文档、翻译、做表格、点界面这类「有手就能干」的活
    boundaries: ["不自己改代码仓库、不提交、不推送", "方向不对就上报，不闷头返工"]
  # 岗位 3：工程 —— 写代码、改配置、跑命令、查资料这类要动手的活。
  # 和「执行」（豆包，点界面 / 写文档）分开：它要的是能跑命令、能改文件的手。
  # dispatch: pull —— 我不在的时候派活等于白烧一次 Run，所以卡留在队列等我领。
  # capabilities 多了三样：delegate（把实现拆给执行岗）、review（当代码审查人）、plan（自己定技术方案）。
  - id: engineering
    title: 工程执行
    heldBy: wb-agent
    isCEO: false
    capabilities: [execute, review, delegate, plan]
    status: active
    quotaDaily: 20
    reportsTo: ceo
    escalationTo: ceo
    dispatch: pull
    duties: 写代码、改配置、跑命令、定技术方案；代码审查与 git 提交推送
    boundaries: ["只对登记过的仓库做提交和推送（scripts/repo.js 白名单）", "永不 force push；拿不准就先上报", "不替董事会做对外承诺"]
clients: [web]
# web：看板 inbox 用；desktop：看板关着时也弹气泡提醒「待你拍板」。
notifier: [web, desktop]
